<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D190C"/>
      <stop offset="100%" stop-color="#120A05"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="10" y="10" width="220" height="220" rx="44" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="3.5" filter="drop-shadow(0 8px 24px rgba(245,158,11,0.25))"/>

  <!-- Inner Ornamental Border -->
  <rect x="18" y="18" width="204" height="204" rx="36" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6,4"/>

  <!-- Steam Whisps -->
  <path d="M102 56 Q97 45 102 36 Q107 27 101 20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 54 Q115 42 120 32 Q125 22 119 16" fill="none" stroke="url(#amberGlow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M138 56 Q143 45 138 36 Q133 27 139 20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Elegant Coffee Cup & Culinary Cloche Centerpiece -->
  <!-- Cup Base / Saucer -->
  <ellipse cx="120" cy="116" rx="48" ry="7" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M82 72 L88 108 C90 114 100 118 120 118 C140 118 150 114 152 108 L158 72 Z" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <!-- Cup Handle -->
  <path d="M155 78 C168 78 174 88 172 96 C170 104 162 108 152 107" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Glowing Heart/Star Accent inside Cup -->
  <path d="M120 86 L122.5 92 L128.5 92.5 L124 96.5 L125.5 102.5 L120 99 L114.5 102.5 L116 96.5 L111.5 92.5 L117.5 92 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>

  <!-- Crown / Star Accents -->
  <circle cx="120" cy="132" r="3" fill="#F59E0B"/>
  <line x1="60" y1="132" x2="110" y2="132" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="132" x2="180" y2="132" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Typography: CAFE DE-LIGHT -->
  <text x="120" y="156" text-anchor="middle" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-weight="700" font-size="21" fill="#FFFDF9" letter-spacing="2.5">CAFE DE-LIGHT</text>
  <text x="120" y="174" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="10" fill="#F59E0B" letter-spacing="3.5">DANAPUR • PATNA</text>

  <!-- Tagline / Est -->
  <text x="120" y="196" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="500" font-size="9" fill="#D4B896" letter-spacing="1">ESTD. 2022 • SAGUNA MORE</text>

  <!-- Bottom Star Accent -->
  <polygon points="120,206 122,211 127,211 123,214 125,219 120,216 115,219 117,214 113,211 118,211" fill="url(#goldGrad)"/>
</svg>
