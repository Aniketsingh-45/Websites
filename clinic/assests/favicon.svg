<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1826"/>
      <stop offset="100%" stop-color="#05090E"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0A0"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(0, 240, 160, 0.4)" stroke-width="2"/>
  
  <!-- Medical Cross / Shield Silhouette -->
  <path d="M26 12H38V26H52V38H38V52H26V38H12V26H26V12Z" fill="url(#emeraldGrad)" opacity="0.25"/>
  
  <!-- Heartbeat ECG Wave -->
  <path d="M12 32H23L27 20L33 44L38 27L42 35L45 32H52" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Pulsing Dot -->
  <circle cx="52" cy="32" r="2.5" fill="#00F0A0"/>
</svg>
