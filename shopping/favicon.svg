<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>

    <!-- Saffron & Ruby Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E0115F"/>
      <stop offset="50%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Inner Ornate Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255, 215, 0, 0.25)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Royal Diya / Lotus Base -->
  <path d="M18 36 C 22 46, 42 46, 46 36 C 41 39, 23 39, 18 36 Z" fill="url(#goldGrad)" />
  <ellipse cx="32" cy="36" rx="14" ry="3" fill="#B38012"/>

  <!-- Diya Stand Pedestal -->
  <path d="M28 43 L36 43 L38 48 L26 48 Z" fill="url(#goldGrad)"/>
  <rect x="24" y="48" width="16" height="2" rx="1" fill="#FFE066"/>

  <!-- Divine Glowing Flame -->
  <path d="M32 14 C 28 22, 26 26, 26 31 C 26 34.5, 28.7 37, 32 37 C 35.3 37, 38 34.5, 38 31 C 38 26, 36 22, 32 14 Z" 
        fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Flame Inner Core -->
  <path d="M32 21 C 30 25, 29 28, 29 31 C 29 33, 30.3 34.5, 32 34.5 C 33.7 34.5, 35 33, 35 31 C 35 28, 34 25, 32 21 Z" 
        fill="#FFFFFF" opacity="0.85"/>

  <!-- Top Radiance Sparkle -->
  <circle cx="32" cy="11" r="1.5" fill="#FFE066" filter="url(#glow)"/>
</svg>
