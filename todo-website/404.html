<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Desynchronized Timeline | AuraRoutine</title>
  <meta name="theme-color" content="#0F172A">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #090D16;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border: rgba(112, 71, 255, 0.25);
      --border-glow: rgba(34, 211, 238, 0.4);
      --cyan: #22D3EE;
      --indigo: #7047FF;
      --pink: #EC4899;
      --blue: #1687FF;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 1.5rem;
    }

    /* Ambient Aurora Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      opacity: 0.35;
      z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      top: -120px;
      left: -120px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
    }

    .orb-2 {
      width: 520px;
      height: 520px;
      bottom: -150px;
      right: -150px;
      background: radial-gradient(circle, var(--indigo), transparent 70%);
      animation-delay: -6s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--pink), transparent 70%);
      opacity: 0.2;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(40px, 40px) scale(1.1);
      }
    }

    /* Card Container */
    .error-card {
      position: relative;
      z-index: 10;
      max-width: 600px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(112, 71, 255, 0.15);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* 404 Glitch Heading */
    .glitch-number {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(5.5rem, 16vw, 8.5rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #22D3EE 0%, #1687FF 40%, #7047FF 75%, #EC4899 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 32px rgba(112, 71, 255, 0.4));
      margin-bottom: 0.5rem;
      user-select: none;
    }

    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.4rem, 3.5vw, 1.85rem);
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 2rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Actions */
    .actions-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 1.8rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #1687FF 0%, #7047FF 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(22, 135, 255, 0.4);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(112, 71, 255, 0.55);
      background: linear-gradient(135deg, #22D3EE 0%, #7047FF 100%);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 1.6rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Countdown Bar */
    .redirect-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .progress-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--indigo));
      transition: width 1s linear;
    }
  </style>
</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="error-card">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Astral Sentinel // Error 404</span>
    </div>

    <h1 class="glitch-number">404</h1>
    <h2 class="error-title">Desynchronized Timeline</h2>
    <p class="error-desc">
      The coordinates you requested do not exist in this sector of the AuraRoutine OS. Let's get you safely back to your productivity command deck.
    </p>

    <div class="actions-group">
      <a href="/" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Return to Mission HUD
      </a>
      <a href="javascript:history.back()" class="btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Go Back
      </a>
    </div>

    <div class="redirect-box">
      <span>Auto-redirecting in <strong id="countdownSec" style="color: var(--cyan);">10</strong>s</span>
      <div class="progress-track">
        <div id="countdownBar" class="progress-fill"></div>
      </div>
    </div>
  </main>

  <script>
    let timeLeft = 10;
    const totalTime = 10;
    const countEl = document.getElementById('countdownSec');
    const barEl = document.getElementById('countdownBar');

    const timer = setInterval(() => {
      timeLeft--;
      if (countEl) countEl.textContent = timeLeft;
      if (barEl) barEl.style.width = ((timeLeft / totalTime) * 100) + '%';

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>

</html>
