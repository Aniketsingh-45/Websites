<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#7047FF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1687FF" />
      <stop offset="100%" stop-color="#7047FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient glow circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Orbiting dots -->
  <circle cx="256" cy="76" r="10" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="436" cy="256" r="10" fill="#EC4899" filter="url(#glow)" />
  <circle cx="128" cy="384" r="8" fill="#7047FF" filter="url(#glow)" />

  <!-- Inner Hexagon / Shield -->
  <polygon points="256,120 376,190 376,330 256,400 136,330 136,190" fill="url(#coreGrad)" opacity="0.25" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Letter A Core Icon -->
  <path d="M256 160 L336 340 H292 L274 298 H238 L220 340 H176 Z M256 226 L244 262 H268 Z" fill="#FFFFFF" />
  
  <!-- Subtle core star -->
  <circle cx="256" cy="256" r="4" fill="#22D3EE" filter="url(#glow)" />
</svg>
